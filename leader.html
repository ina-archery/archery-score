<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>チーム代表の かんたん手順 | Archery Score</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--text:#1d2723;--sub:#5d6b65;--line:#d5dcd8;--accent:#14532d;--on:#fff;--ok:#1a8f4c;--warn:#c0392b;--soft:#e8efeb}
@media (prefers-color-scheme:dark){:root{--bg:#101412;--card:#1a201d;--text:#e8eeea;--sub:#9aa8a1;--line:#2f3a35;--accent:#4cc27e;--on:#08130d;--soft:#242d29}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 "Meiryo","Yu Gothic UI","Hiragino Sans",sans-serif;padding:12px 14px 60px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.15rem;margin:6px 0 2px}
.sub{color:var(--sub);font-size:.88rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.bar{display:flex;gap:6px;margin:8px 0 12px}
.bar i{flex:1;height:8px;border-radius:5px;background:var(--line)}
.bar i.on{background:var(--accent)}
.bar i.cur{background:var(--accent);opacity:.55}
.step{font-size:.85rem;color:var(--sub);margin:0}
h2{font-size:1.2rem;margin:2px 0 8px}
h3{font-size:1.05rem;margin:18px 0 4px;padding-top:10px;border-top:1px solid var(--soft)}
.big{display:block;width:100%;min-height:54px;margin:10px 0 0;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;font-weight:bold;font-size:1.05rem;cursor:pointer;text-align:center;text-decoration:none;padding:12px;touch-action:manipulation}
.big.pri{background:var(--accent);color:var(--on)}
.big:disabled{opacity:.4}
.row{display:flex;gap:10px;margin-top:6px}.row .big{margin-top:8px}
.note{color:var(--sub);font-size:.88rem;margin:8px 0 0}
.mark{display:inline-block;background:var(--soft);border-radius:6px;padding:0 .4em;font-weight:bold}
input,textarea{width:100%;font:inherit;padding:.55em .6em;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-top:6px}
.ok{color:var(--ok);font-weight:bold;margin:6px 0 0}
.ng{color:var(--warn);margin:6px 0 0;font-size:.92rem}
ol{padding-left:1.3em;margin:6px 0}
.hint{background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0 0;font-size:.92rem}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>👥 チーム代表の かんたん手順</h1>
<p class="sub">Archery Score で、チームの記録を見せ合えるようにします。10分ほどです。</p>
<div class="bar" id="bar"></div>
<div id="view"></div>
<p class="note" style="text-align:center;margin-top:18px">Let's keep score!<br>© 2026 M.Inamoto</p>
</main>
<script>
(function(){
'use strict';
var TPL_COPY='https://docs.google.com/forms/d/1uJ7fcYiR81g40UguXlBm7wpG5GDjIt82QxJaEJVbu6Q/copy';
var APP=new URL('./',location.href).href;
var KEY='archery_leader_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load(); S.step=Math.min(S.step||0,3); S.csv=S.csv||''; S.form=S.form||''; S.name=S.name||'';
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function formId(v){var m=/forms\/d\/e\/([A-Za-z0-9_\-]+)/.exec(v||'');return m&&/^1FAIpQL[A-Za-z0-9_\-]{20,}$/.test(m[1])?m[1]:null}
function csvId(v){var m=/spreadsheets\/d\/e\/([A-Za-z0-9_\-]+)\/pub/.exec(v||'');return m&&/^2PACX-[A-Za-z0-9_\-]{20,}$/.test(m[1])?m[1]:null}
function shId(v){var m=/spreadsheets\/d\/([A-Za-z0-9_\-]{30,60})/.exec(v||'');return m&&!/^2PACX/.test(m[1])?m[1]:null}
function okSheet(v){return !!(csvId(v)||shId(v))}
var TOTAL=4;
function sortIn(tx,pref){tx=(tx||'').trim();if(!tx)return;if(formId(tx))S.form=tx;else if(okSheet(tx))S.csv=tx;else S[pref]=tx}
function box(k,label,ex,val,ok,bad){
 var h='<div class="hint" style="margin-top:14px"><b>'+label+'</b><br>'+ex+'</div><button class="big" data-paste="'+k+'">📋 コピーしたリンクを貼る</button><textarea id="'+k+'In" rows="2" placeholder="ここに貼ってもかまいません">'+esc(val)+'</textarea>';
 if(val)h+=ok?'<p class="ok">✅ リンクを確認できました</p>':'<p class="ng">'+bad+'</p>';
 return h}
var steps=[
 function(){return '<p class="step">はじめに</p><h2>用意するもの</h2><ul style="padding-left:1.2em;margin:6px 0"><li>Googleアカウント（Gmailなど）</li><li>スマホかパソコン（見やすいほうでOK）</li><li>10分ほどの時間</li></ul><div class="hint">🔒 記録は、<b>あなたのGoogleのスプレッドシート</b>にだけ入ります。アプリの作者には届きません。他のチームにも見えません。</div><div class="hint">💡 このページは<b>開いたままにして</b>、Googleは<b>別の画面（タブ）</b>で開きます。パソコンなら、2つの画面を並べると、迷いません。スマホなら、ホーム画面の切り替えで行き来します。</div><button class="big pri" data-go="1">はじめる</button>'},
 function(){return '<p class="step">手順 1 / 3</p><h2>Googleで準備する（まとめて）</h2><p>先に、下のボタンでGoogleを<b>別の画面</b>で開きます。このページは閉じないでください。</p><button class="big pri" data-open="'+TPL_COPY+'">① Googleでフォームをコピーする</button><div class="hint">開いた画面で、青い <span class="mark">コピーを作成</span> を押します。そのあとは、下の ② から順番に進めてください。</div>'
  +'<h3>② フォームを公開する</h3><p>コピーされたフォーム（<b>紫色</b>の画面）の、右上の <span class="mark">公開</span> を押します。出てきた画面でも、もう一度 <span class="mark">公開</span> を押します。</p>'
  +'<h3>③ 回答をスプレッドシートに集める</h3><p>フォームの上の <span class="mark">回答</span> → <span class="mark">スプレッドシートにリンク</span> → <span class="mark">作成</span> を押します。<b>緑色</b>のスプレッドシートが開きます。</p>'
  +'<h3>④ スプレッドシートを共有する</h3><p>開いた<b>緑色</b>の画面で：</p><ol><li>右上の <span class="mark">共有</span>（人のマーク）を押す</li><li><span class="mark">一般的なアクセス</span> を、<span class="mark">リンクを知っている全員</span> にする</li><li>右の役割は <span class="mark">閲覧者</span> のままにする（<b>編集者にしない</b>）</li><li><span class="mark">リンクをコピー</span> を押して、メモ帳かLINEの「自分だけのトーク」に貼っておく</li></ol>'
  +'<h3>⑤ フォームのリンクをコピーする</h3><p><b>紫色</b>のフォームの画面に戻って：右上の <span class="mark">鎖のマーク</span> → <span class="mark">コピー</span> を押します。このリンクも、メモに貼っておきます。</p>'
  +'<div class="hint">これで、リンクが2つできました。<br>・<b>spreadsheets</b> で始まるリンク（④）<br>・<b>forms</b> で始まるリンク（⑤）<br>次の画面で、この2つを貼ります。</div>'+nav(1,true)},
 function(){
  var f=formId(S.form),c=okSheet(S.csv),h='<p class="step">手順 2 / 3</p><h2>2つのリンクを貼る</h2><p>メモなどからコピーして、下に貼ります。どちらの欄に貼っても、自動で正しい欄に入ります。</p>';
  h+=box('csv','① スプレッドシートのリンク','<b>docs.google.com/spreadsheets/…</b> で始まる（④でコピーしたもの）',S.csv,!!c,'これは違うリンクです。④の「共有」でコピーした、<b>spreadsheets</b> で始まるリンクを貼ってください。');
  h+=box('form','② フォームのリンク','<b>forms</b> で始まる（⑤で出たもの）',S.form,!!f,'これは違うリンクです。⑤の鎖のマークで出た、<b>forms</b> で始まるリンクを貼ってください。');
  return h+nav(2,!!(f&&c))},
 function(){
  var f=formId(S.form),c=okSheet(S.csv),nm=(S.name||'').trim(),h='<p class="step">手順 3 / 3</p><h2>チームの招待リンクを作る</h2><p>チームの名前を入れてください。</p><input id="nameIn" maxlength="40" placeholder="例：○○大学アーチェリー部" value="'+esc(S.name)+'">';
  if(f&&c&&nm){var link=APP+'#team='+b64e(csvId(S.csv)?{f:f,c:csvId(S.csv),n:nm}:{f:f,s:shId(S.csv),n:nm}),msg='Archery Score のチーム「'+nm+'」に入るリンクです。開いて「入る」を押してください。\n'+link;
   h+='<p class="ok">🎉 できました！ このリンクを選手に送ります。</p><textarea id="linkOut" rows="4" readonly>'+esc(link)+'</textarea><button class="big pri" data-copy="'+esc(link)+'">📋 リンクをコピー</button><a class="big pri" target="_blank" rel="noopener" href="https://line.me/R/msg/text/?'+encodeURIComponent(msg)+'">💬 LINEで送る</a><button class="big" data-share="'+esc(link)+'|'+esc(nm)+'">📤 ほかのアプリで送る</button><div class="hint"><b>選手には、こう伝えてください：</b><br>① リンクを開く → 「入る」を押す<br>② アプリの「設定」→「チームで共有」で、名前を入れて「このチームに送る」をON</div><p class="note">⚠ このリンクは、チームの人だけに送ってください。リンクを知っている人は、記録を送ったり見たりできます。</p>'}
  else h+='<p class="note">名前を入れると、招待リンクができます。</p>';
  return h+'<div class="row"><button class="big" data-go="2">← 戻る</button></div>'}
];
function nav(i,ok){return '<div class="row"><button class="big" data-go="'+(i-1)+'">← 戻る</button><button class="big pri" '+(ok?'':'disabled')+' data-go="'+(i+1)+'">できた → 次へ</button></div>'}
function render(){
  var bar='';for(var i=0;i<TOTAL;i++)bar+='<i class="'+(i<S.step?'on':(i===S.step?'cur':''))+'"></i>';
  document.getElementById('bar').innerHTML=bar;
  document.getElementById('view').innerHTML='<div class="card">'+steps[S.step]()+'</div>';
  window.scrollTo(0,0)}
function go(n){S.step=Math.max(0,Math.min(TOTAL-1,n));save();render()}
function flash(t){var d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:14px;right:14px;bottom:24px;max-width:520px;margin:0 auto;background:#14532d;color:#fff;border-radius:12px;padding:10px;text-align:center;z-index:9';document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-open],[data-paste],[data-copy],[data-share]');if(!b||b.disabled)return;
  if(b.dataset.go!=null){go(+b.dataset.go)}
  else if(b.dataset.open){window.open(b.dataset.open,'_blank','noopener')}
  else if(b.dataset.paste){var k=b.dataset.paste;
    if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(tx){sortIn(tx,k);save();render()},function(){flash('貼り付けできませんでした。下の欄に貼ってください')})}
    else flash('下の欄に貼ってください')}
  else if(b.dataset.copy){var tx=b.dataset.copy,ok=function(){flash('コピーしました')};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(ok,function(){var a=document.getElementById('linkOut');if(a){a.select();document.execCommand('copy');ok()}});
    else{var a=document.getElementById('linkOut');if(a){a.select();document.execCommand('copy');ok()}}}
  else if(b.dataset.share){var p=b.dataset.share.split('|');if(navigator.share)navigator.share({title:'Archery Score',text:'Archery Score のチーム「'+p[1]+'」に入るリンクです。開いて「入る」を押してください。',url:p[0]}).catch(function(){});else flash('「リンクをコピー」を使ってください')}
});
document.addEventListener('input',function(e){var x=e.target;
  if(x.id==='csvIn'){sortIn(x.value,'csv');save();clearTimeout(window.__t);window.__t=setTimeout(render,500)}
  else if(x.id==='formIn'){sortIn(x.value,'form');save();clearTimeout(window.__t);window.__t=setTimeout(render,500)}
  else if(x.id==='nameIn'){S.name=x.value;save();clearTimeout(window.__t);window.__t=setTimeout(function(){var el=document.getElementById('nameIn'),pos=el.selectionStart;render();var n=document.getElementById('nameIn');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}},600)}});
render();
})();
</script>
</body>
</html>
